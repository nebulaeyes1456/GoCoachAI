# ============================================================================
# GoCoachAI 分析配置（窗口1 生成，最小可用）
#
# 被以下组件共用：
#   - ``katago analysis`` 引擎进程（backend/services/engine/engine.py）
#   - ``katago kata-analyze`` 整局批量分析（backend/services/engine/analyze_sgf.py）
#   - 基准测试（scripts/benchmark.py）
#
# 约定：
#   - numSearchThreads 与 config.yaml 的 katago.threads 保持一致（CPU 14 线程用 12）；
#   - 本文件**不写** numAnalysisThreads（由命令行 -analysis-threads 指定，
#     否则 KataGo 会报"冗余且禁止"错误）；
#   - maxVisits 为默认值，实际调用按 profile 用 -override-config 覆盖；
#   - reportAnalysisWinratesAs = SIDETOMOVE：winrate 均为"当前行棋方"视角，
#     复盘服务据此换算每手 before/after 胜率（见 docs/architecture.md §4.1）。
# ============================================================================

# --- 日志 ---
logToStderr = true
logAllRequests = false
logAllResponses = false
logSearchInfo = false

# --- 搜索资源 ---
numSearchThreads = 12

# --- 分析限制（默认值，实际由 profile 覆盖） ---
maxVisits = 200
maxTime = 600

# --- 神经网络缓存（32GB 内存可设 21=2GB 缓存） ---
nnCacheSizePowerOfTwo = 21
nnMaxBatchSize = 32

# --- 胜率视角：SIDETOMOVE（当前行棋方） ---
reportAnalysisWinratesAs = SIDETOMOVE

# --- PV 长度 ---
analysisPVLen = 30
