# YiYou configuration template.
# Copy this file to data/config.yaml and fill in your own values.
# NEVER commit data/config.yaml — it contains your API key.

katago:
  executable: engine/katago-opencl.exe       # Linux: engine/katago-opencl（后端会自动适配 .exe 后缀）
  executable_cpu: engine/katago-eigenavx2.exe  # Linux: engine/katago-eigenavx2
  backend: auto
  model: engine/b10c128.bin.gz
  max_visits:
    fast: 400
    standard: 1200
    fine: 3000
  threads: 12
  analysis_threads: 1
  detected_backend: opencl
coach:
  provider: deepseek        # deepseek | ollama
  api_key: YOUR_API_KEY_HERE
  base_url: https://api.deepseek.com
  model: deepseek-chat
  ollama:
    base_url: http://127.0.0.1:11434
    model: qwen2.5:14b
  pricing:
    deepseek-chat:
      input: 2.0
      output: 8.0
review:
  profile: fine
  blunder_threshold: 0.12
  question_threshold: 0.06
  good_threshold: 0.06
  handicap_relax: 1.5
problems:
  crop_radius: 4
  candidate_radius: 1
  max_candidates: 12
  verify_profile:
    life_death: fine
    capturing_race: fine
    endgame: standard
    middle: standard
  urgency_max_winrate: 0.3
  endgame_move_fraction: 0.8
  # 题链生长（v1.7.0，可选；默认即契约阈值）
  chain_crop_pad: 1
  chain_max_bbox: 9
  chain_region_pad: 2
  chain_verify_mode: local_board # local_board（默认）| local_death | relative（相对判据）| winrate
  chain_relative_gap: 0.5        # relative：正解需比次优高出的胜率（唯一急所）
  chain_relative_urgency: 0.3    # relative：正解需比脱先高出的胜率（必须现在处理）
  chain_relative_floor: 0.0      # relative：可选的绝对胜率下限（默认不设）
  chain_library_min_winrate: 0.6 # library：正解胜率下限（=古典题入库线 MIN_ANSWER_WINRATE）
  chain_library_min_gap: 0.15    # library：正解 − 次优 的下限（答案明显更优）
  chain_board_margin: 2          # local_board：小棋盘余量
  chain_board_min_size: 5        # local_board：小棋盘最小边长
  chain_own_min: 0.75            # 局部死活：正解目标区归属下限（正=先手方控住该区）
  chain_tenuki_min: 0.15         # 局部死活：脱先损失下限（0.15=半紧急，0.4=紧急）
  chain_death_profile: fast      # 局部死活推演档位
  chain_death_pv_len: 6          # 局部死活推演走多少手 PV
  chain_answer_min_winrate: 0.95 # winrate 口径：正解胜率下限（契约值）
  chain_second_max_winrate: 0.3  # winrate 口径：次优胜率上限（契约值）
  chain_target_rank: -5
  extract_signal_threshold: 0.06
  endgame_swing_threshold: 0.12
  extract_review_timeout: 900
server:
  port: 8765
  log_file: data/app.log
budget:
  token_limit_month: 30
